# VM override (GCP e2-small, 2 vCPU / 2 GB): Neon + R2 managed, nginx on 136.85.55.175.sslip.io (sslip.io).
# Use: docker compose -f docker-compose.prod.yml -f docker-compose.vm.yml up -d --build
# First TLS certificate: see deploy/nginx-vm/README.md.
services:
  api:
    # Cold import of app.main takes ~55s on this VM; give uvicorn time to bind.
    healthcheck:
      start_period: 180s
  nginx:
    volumes:
      - ./deploy/nginx-vm:/etc/nginx/conf.d:ro
    # Reload every 6h so nginx picks up certificates renewed by the certbot container.
    command: /bin/sh -c 'while :; do sleep 6h & wait $${!}; nginx -s reload; done & exec nginx -g "daemon off;"'
