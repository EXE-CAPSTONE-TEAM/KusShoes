# KusShoes API on the project domain. Same upstream as 10-https.conf (sslip.io), which stays
# until every client (web, desktop, released APKs) has moved to this host.
server {
    listen 443 ssl;
    http2 on;
    server_name api.kusshoes.kietta.me;
    ssl_certificate     /etc/letsencrypt/live/api.kusshoes.kietta.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.kusshoes.kietta.me/privkey.pem;
    client_max_body_size 300m;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    location / {
        proxy_pass http://api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
