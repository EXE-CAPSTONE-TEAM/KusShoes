# KIRI relay — scan intake for the mobile app (spec §D). Videos go straight to R2 via presigned
# PUT, so request bodies here are small JSON.
server {
    listen 443 ssl;
    http2 on;
    server_name relay.136.85.55.175.sslip.io;
    ssl_certificate     /etc/letsencrypt/live/relay.136.85.55.175.sslip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.136.85.55.175.sslip.io/privkey.pem;
    client_max_body_size 1m;
    proxy_read_timeout 120s;
    location / {
        proxy_pass http://kiri-relay:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
    }
}
