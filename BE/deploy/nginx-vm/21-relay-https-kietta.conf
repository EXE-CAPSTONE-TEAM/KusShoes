# KIRI relay on the project domain. Same upstream as 20-relay-https.conf (sslip.io), which stays
# until released mobile APKs stop calling it.
server {
    listen 443 ssl;
    http2 on;
    server_name relay.kusshoes.kietta.me;
    ssl_certificate     /etc/letsencrypt/live/relay.kusshoes.kietta.me/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/relay.kusshoes.kietta.me/privkey.pem;
    client_max_body_size 1m;
    proxy_read_timeout 120s;
    location / {
        proxy_pass http://kiri-relay:8010;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }
}
