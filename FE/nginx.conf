server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; frame-ancestors 'none';" always;

    # Long-cache fingerprinted assets (^~ so the public-image rule below never overrides it)
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Un-hashed files from public/ (logos, favicons, og-image): cache for a week. `expires` sets
    # Cache-Control without add_header, so the server-level security headers still apply.
    location ~* \.(?:png|jpe?g|webp|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Agent skill files linked from /.well-known/ai-catalog.json (nginx has no .md MIME type)
    location ~ \.md$ {
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }

    # SPA fallback — hand-rolled history-API router needs every path to serve index.html.
    # Public routes (/pricing, /products, ...) have their own prerendered <route>.html with
    # route-specific SEO tags (vite-plugin-seo.ts), so try that first.
    location / {
        try_files $uri $uri.html $uri/ /index.html;
    }

    # index.html must never be cached (points at fingerprinted bundles)
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
