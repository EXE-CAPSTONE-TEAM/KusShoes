# HTML must never be cached (it points at fingerprinted bundles): index.html and the prerendered
# route pages, whichever location serves them. An empty value means no header is added.
map $sent_http_content_type $html_cache_control {
    ~^text/html "no-cache";
    default     "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Every location that calls add_header must include the security headers itself: nginx does
    # not inherit server-level add_header into such a location.

    # Long-cache fingerprinted assets
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback — hand-rolled history-API router needs every path to serve index.html.
    # Public routes (/pricing, /products, ...) have their own prerendered <route>.html with
    # route-specific SEO tags (vite-plugin-seo.ts), so try that first.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $html_cache_control always;
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
