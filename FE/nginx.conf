# HTML must never be cached (it points at fingerprinted bundles): index.html and the prerendered
# route pages, whichever location serves them. An empty value means no header is added.
map $sent_http_content_type $html_cache_control {
    ~^text/html "no-cache";
    default     "";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Security headers. Server level covers every location that sets no add_header of its own;
    # a location that does (assets, HTML) must include them again, because nginx then drops the
    # inherited server-level add_header directives.
    include /etc/nginx/snippets/security-headers.conf;

    # Long-cache fingerprinted assets (^~ so the public-image rule below never overrides it)
    location ^~ /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Un-hashed files from public/ (logos, favicons, og-image): cache for a week. `expires` sets
    # Cache-Control without add_header, so the server-level security headers still apply.
    location ~* \.(?:png|jpe?g|webp|svg|ico)$ {
        expires 7d;
        try_files $uri =404;
    }

    # Agent skill files linked from /.well-known/ai-catalog.json (nginx has no .md MIME type)
    location ~ \.md$ {
        default_type "text/markdown; charset=utf-8";
        try_files $uri =404;
    }

    # SPA fallback — hand-rolled history-API router needs every path to serve index.html.
    # Public routes (/pricing, /products, ...) have their own prerendered <route>.html with
    # route-specific SEO tags (vite-plugin-seo.ts), so try that first.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control $html_cache_control always;
        try_files $uri $uri.html $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
