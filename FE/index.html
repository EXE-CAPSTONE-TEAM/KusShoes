  <style>
    /* Crawler fallback text: it only exists for HTML-only crawlers and always sits under the boot
       overlay until React replaces it. The app CSS arrives after the first paint
       (vite-plugin-async-css.ts) and its reset would move this text around, so it is never
       rendered visibly; that keeps it out of CLS. */
    body{margin:0}
    .seo-fallback{visibility:hidden;font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  </style>
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=GTM-NFVKQXLB"

  <!-- End Google Tag Manager (noscript) -->
  <div id="root"><!--seo:body--><!--/seo:body--></div>
  <style>
    #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0F0F0F;transition:opacity .2s}
    [data-theme="light"] #boot{background:#FAFAFA}
    /* The logo shows on the very first frame (it is the page's first contentful paint); only the
       progress track fades in, and only if loading takes a moment. */
    #boot .box{display:flex;flex-direction:column;align-items:center;gap:20px}
    #boot img{height:32px}
    #boot .logo-light{display:none}
    [data-theme="light"] #boot .logo-light{display:block}
    [data-theme="light"] #boot .logo-dark{display:none}
    #boot .track{width:160px;height:2px;background:#2A2A2A;overflow:hidden;opacity:0;animation:boot-in .2s .15s forwards}
    [data-theme="light"] #boot .track{background:#E5E5E5}
    #boot .bar{height:100%;background:#FF6B35;transform:scaleX(var(--p,0));transform-origin:left;transition:transform .3s cubic-bezier(.2,0,0,1)}
    #boot.done{opacity:0;pointer-events:none}
    @keyframes boot-in{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){#boot,#boot .bar{transition:none}#boot .track{animation-duration:0s;animation-delay:.15s}}
  </style>
  <div id="boot" role="progressbar" aria-label="Loading KusShoes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="box">
      <img class="logo-dark" src="/KusShoes_Logo_Dark_Mode_cropped.webp" alt="" width="103" height="32">
      <img class="logo-light" src="/KusShoes_Logo_cropped.webp" alt="" width="103" height="32">
      <div class="track"><div class="bar"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
