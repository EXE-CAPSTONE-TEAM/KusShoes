<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Google Tag Manager & DataLayer Initializer -->
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    // Consent Mode v2: nothing is stored until the visitor accepts in the cookie banner. A
    // saved choice (src/analytics/consent.ts, same key and version) applies before GTM loads.
    (function () {
      var analytics = 'denied', ads = 'denied';
      try {
        var saved = JSON.parse(localStorage.getItem('kusshoes_cookie_consent') || 'null');
        if (saved && saved.version === 1) {
          if (saved.analytics === true) analytics = 'granted';
          if (saved.ads === true) ads = 'granted';
        }
      } catch (e) {}
      gtag('consent', 'default', {
        'analytics_storage': analytics,
        'ad_storage': ads,
        'ad_user_data': ads,
        'ad_personalization': ads
      });
    })();
    (function(w,d,s,l,i){
      var gtmId = '%VITE_GTM_ID%';
      if (!gtmId || gtmId === '%VITE_GTM_ID%') return;
      w[l]=w[l]||[];w[l].push({'gtm.start': new Date().getTime(),event:'gtm.js'});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s),dl=l!='dataLayer'?'&l='+l:'';
      j.async=true;j.src='https://www.googletagmanager.com/gtm.js?id='+gtmId+dl;
      f.parentNode.insertBefore(j,f);
    })(window,document,'script','dataLayer','%VITE_GTM_ID%');
  </script>
  <!-- Filled per route at build time by vite-plugin-seo.ts (data: src/seo/pages.ts) -->
  <!--seo:head--><!--/seo:head-->
  <style>
    /* Crawler fallback text sits under the boot overlay; a system font keeps the bundle's
       webfont swap from shifting it (CLS). React replaces it on first render. */
    .seo-fallback{font-family:system-ui,-apple-system,'Segoe UI',sans-serif}
  </style>
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <!-- Google Tag Manager (noscript) -->
  <noscript><iframe src="https://www.googletagmanager.com/ns.html?id=%VITE_GTM_ID%"
  height="0" width="0" style="display:none;visibility:hidden"></iframe></noscript>
  <div id="root"><!--seo:body--><!--/seo:body--></div>
  <style>
    #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0F0F0F;transition:opacity .2s}
    [data-theme="light"] #boot{background:#FAFAFA}
    #boot .box{display:flex;flex-direction:column;align-items:center;gap:20px;opacity:0;animation:boot-in .2s .15s forwards}
    #boot img{height:32px}
    #boot .logo-light{display:none}
    [data-theme="light"] #boot .logo-light{display:block}
    [data-theme="light"] #boot .logo-dark{display:none}
    #boot .track{width:160px;height:2px;background:#2A2A2A;overflow:hidden}
    [data-theme="light"] #boot .track{background:#E5E5E5}
    #boot .bar{height:100%;background:#FF6B35;transform:scaleX(var(--p,0));transform-origin:left;transition:transform .3s cubic-bezier(.2,0,0,1)}
    #boot.done{opacity:0;pointer-events:none}
    @keyframes boot-in{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){#boot,#boot .bar{transition:none}#boot .box{animation-duration:0s;animation-delay:.15s}}
  </style>
  <div id="boot" role="progressbar" aria-label="Loading KusShoes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="box">
      <img class="logo-dark" src="/KusShoes_Logo_Dark_Mode_cropped.png" alt="" width="103" height="32">
      <img class="logo-light" src="/KusShoes_Logo_cropped.png" alt="" width="103" height="32">
      <div class="track"><div class="bar"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
