<!doctype html>
<html lang="vi">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/x-icon" href="/favicon.ico" />
  <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- Filled per route at build time by vite-plugin-seo.ts (data: src/seo/pages.ts) -->
  <!--seo:head--><!--/seo:head-->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,300;0,400;0,500;0,700;0,900;1,400;1,700&amp;family=Outfit:wght@300;400;500;600;700;800&amp;family=Space+Mono:ital,wght@0,400;0,700;1,400;1,700&amp;family=Space+Grotesk:wght@400;500;600;700;800&amp;display=swap">
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('theme');
        if (saved === 'light' || saved === 'dark') {
          document.documentElement.setAttribute('data-theme', saved);
        } else {
          document.documentElement.setAttribute('data-theme', 'dark');
        }
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'dark');
      }
    })();
  </script>
</head>

<body>
  <div id="root"><!--seo:body--><!--/seo:body--></div>
  <style>
    #boot{position:fixed;inset:0;z-index:9999;display:grid;place-items:center;background:#0F0F0F;transition:opacity .2s}
    [data-theme="light"] #boot{background:#FAFAFA}
    #boot .box{display:flex;flex-direction:column;align-items:center;gap:20px;opacity:0;animation:boot-in .2s .15s forwards}
    #boot img{height:32px}
    #boot .logo-light{display:none}
    [data-theme="light"] #boot .logo-light{display:block}
    [data-theme="light"] #boot .logo-dark{display:none}
    #boot .track{width:160px;height:2px;background:#2A2A2A;overflow:hidden}
    [data-theme="light"] #boot .track{background:#E5E5E5}
    #boot .bar{height:100%;background:#FF6B35;transform:scaleX(var(--p,0));transform-origin:left;transition:transform .3s cubic-bezier(.2,0,0,1)}
    #boot.done{opacity:0;pointer-events:none}
    @keyframes boot-in{to{opacity:1}}
    @media (prefers-reduced-motion:reduce){#boot,#boot .bar{transition:none}#boot .box{animation-duration:0s;animation-delay:.15s}}
  </style>
  <div id="boot" role="progressbar" aria-label="Loading KusShoes" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
    <div class="box">
      <img class="logo-dark" src="/KusShoes_Logo_Dark_Mode_cropped.png" alt="">
      <img class="logo-light" src="/KusShoes_Logo_cropped.png" alt="">
      <div class="track"><div class="bar"></div></div>
    </div>
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
