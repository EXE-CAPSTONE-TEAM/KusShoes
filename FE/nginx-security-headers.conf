# Security headers, included by every location in nginx.conf: nginx drops server-level
# add_header directives in any location that sets its own, so they cannot live at server level.
#
# The script-src hash placeholder is filled at image build time (scripts/render-nginx-csp.mjs)
# with the sha256 of each inline <script> in the built HTML (consent/GTM/gtag bootstrap,
# theme), so those run without 'unsafe-inline'. Third-party script hosts: Google Tag Manager
# and GA4 (gtag.js), plus the Meta and TikTok pixels GTM may load. GTM "Custom HTML" tags are
# inline and stay blocked: use GTM's template tags instead.
add_header X-Frame-Options "DENY" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; script-src 'self' __CSP_SCRIPT_HASHES__ https://www.googletagmanager.com https://*.googletagmanager.com https://connect.facebook.net https://analytics.tiktok.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https: blob:; font-src 'self' data:; connect-src 'self' https: wss:; frame-src https://www.googletagmanager.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none';" always;
